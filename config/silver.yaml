# Paramètres de la couche Silver.
# Un seuil qui n'a pas encore été constaté sur les données vaut null.
coordonnees:
  # Emprise de la France métropolitaine (Corse comprise), en degrés WGS84 — paramètre, pas une donnée.
  lat_min: 41.0
  lat_max: 51.5
  lon_min: -5.5
  lon_max: 10.0
  precision_min_decimales: 4   # 4 décimales ≈ 11 m
gtfs:
  seuil_rg06_m: 100            # m — fixé le 21/10 après constat (médiane 12,2 ; p95 59,3 ; max 183,5) : alerte, pas rejet
gbfs:
  # source_id : mode de l'option et nom utilisé dans les tables
  S01: {mode: citiz, nom: citiz}
  S08: {mode: velo, nom: yelo}
territoires:
  # SIREN et nombre de communes : docs/selection_territoire.md, porte G2 (constatés dans S04 le 21/10).
  larochelle: {siren: "241700434", nb_communes: 28, role: decision}
  angers: {siren: "244900015", nb_communes: 29, role: apprentissage_h6}
  poitiers: {siren: "200069854", nb_communes: 40, role: apprentissage_h6}
  nantes: {siren: "244400404", nb_communes: 24, role: apprentissage_h6}
  rennes: {siren: "243500139", nb_communes: 43, role: apprentissage_h6}
filosofi:
  couche: carreaux_200m_met
  separateur_lcog_geo: ","          # constaté le 21/10/2026
  tolerance_aire_relative: 0.01     # constaté : écart maximal 0,19 % sur les 5 EPCI (RC-09)
spatial:
  tampon_m: 500                 # identique au tampon de la requête S05 (contrôlé à l'exécution)
  distance_max_marche_m: 400    # H2 : 5 min ≈ 400 m ; au-delà, un rattachement seul épuise le budget (RG-08)
